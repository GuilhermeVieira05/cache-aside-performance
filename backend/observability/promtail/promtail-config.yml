server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: nestjs
    static_configs:
      - targets:
          - localhost
        labels:
          job: nestjs
          env: development
          __path__: /logs/development.log
    pipeline_stages:
      - regex:
          expression: '(?P<level>DEBUG|INFO|WARN|ERROR|FATAL)'
      - labels:
          level:
      - regex:
          expression: '\[(?P<cache_event>CACHE HIT|CACHE MISS|CACHE INVALIDATE)\]'
      - labels:
          cache_event:
